<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>平台接诊量监测与增量预警 · MIIA-AI</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#1E3A6F; --blue:#2F6BFF; --text:#1F2937; --sub:#6B7280; --muted:#8A94A6;
  --line:#E5E7EB; --bg:#F4F7FB; --card:#FFF; --ok:#16A34A; --warn:#FA8C16; --bad:#E5484D;
}
html,body{height:100%}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.nav{flex:0 0 48px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}
.nav .yh{width:26px;height:26px;border-radius:4px;background:#2F6BFF;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700}
.nav .nm{font-size:14px;font-weight:600;letter-spacing:.4px}
.nav .sp{flex:1}
.nav .org{font-size:11.5px;color:#C7D6EC;text-align:right;line-height:1.35}
.nav .org b{display:block;font-weight:500;color:#fff;font-size:12px}
.nav .win{display:flex;gap:14px;margin-left:14px;color:#C7D6EC}
.wrap{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 12px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
.hd h1{margin:0;font-size:17px;font-weight:600}
.hd .sub{margin-top:5px;font-size:12px;color:var(--sub);line-height:1.7;max-width:900px}
.hd .acts{display:flex;gap:8px;padding-top:2px}
.btn{height:30px;padding:0 14px;border:1px solid #D6DCE8;background:#fff;border-radius:4px;font-size:12.5px;
  color:#374151;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#B9C6DC}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#2560F0}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
/* 筛选 */
.fbar{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;position:relative;z-index:30}
.fi{display:flex;align-items:center;gap:7px}
.fi>span{font-size:12.5px;color:#4B5563;white-space:nowrap}
.fi select,.fi input[type=date]{height:30px;border:1px solid #DCE3E1;border-radius:4px;padding:0 9px;font-size:12.5px;
  background:#fff;color:#333;outline:0}
.fi select{min-width:132px}
.fbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid #DCE3E1;border-radius:4px;overflow:hidden}
.seg button{height:28px;padding:0 12px;border:0;background:#fff;font-size:12.5px;color:#4B5563;cursor:pointer;
  border-right:1px solid #EEF1F5}
.seg button:last-child{border-right:0}
.seg button.on{background:#E8F1FF;color:#1D4ED8;font-weight:600}
/* 可搜索下拉 */
.sselect{position:relative;width:214px}
.sselect input{width:100%;height:30px;border:1px solid #DCE3E1;border-radius:4px;padding:0 26px 0 9px;
  font-size:12.5px;color:#333;outline:0;background:#fff}
.sselect .caret{position:absolute;right:9px;top:7px;color:#9AA6A3;font-size:11px;pointer-events:none}
.sdrop{position:absolute;left:0;top:34px;width:300px;background:#fff;border:1px solid #E5E7EB;border-radius:4px;
  box-shadow:0 8px 24px rgba(16,24,40,.14);z-index:50;padding:8px}
.sdrop .sq{width:100%;height:28px;border:1px solid #DCE3E1;border-radius:3px;padding:0 8px;font-size:12.5px;outline:0}
.slist{max-height:264px;overflow-y:auto;margin-top:6px}
.slist::-webkit-scrollbar{width:8px}
.slist::-webkit-scrollbar-thumb{background:#D6DCE8;border-radius:4px}
.slist .it{padding:6px 8px;font-size:12.5px;color:#374151;cursor:pointer;border-radius:3px;
  display:flex;align-items:center;gap:8px}
.slist .it:hover,.slist .it.on{background:#EFF5FF;color:#1D4ED8}
.slist .it em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--muted)}
.slist .none{padding:12px;text-align:center;color:var(--muted);font-size:12px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px 15px}
.kpi .lb{font-size:12.5px;color:var(--sub)}
.kpi .vl{font-size:24px;font-weight:600;line-height:1.25;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .vl em{font-size:12px;font-style:normal;color:var(--muted);font-weight:400;margin-left:5px}
.kpi .dt{font-size:11.5px;color:var(--muted);margin-top:4px}
.up{color:var(--bad)} .down{color:var(--ok)} .flat{color:var(--muted)}
/* 卡片 */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px 14px;position:relative;z-index:1}
.c8{grid-column:span 8} .c4{grid-column:span 4} .c6{grid-column:span 6} .c7{grid-column:span 7}
.c5{grid-column:span 5} .c12{grid-column:span 12}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ch h3{margin:0;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.ch h3::before{content:"";width:3px;height:13px;background:var(--blue);border-radius:2px}
.ch em{font-style:normal;font-size:11.5px;color:var(--muted)}
.ch .sp{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;color:#4B5563}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.legend .dash{width:14px;height:0;border-top:1.5px dashed #E5484D;border-radius:0;margin-bottom:3px}
.legend .dash.g{border-top-color:#8A94A6}
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%}
/* 排行 */
.rank{display:flex;flex-direction:column}
.rank .row{display:grid;grid-template-columns:24px 1fr 76px 54px;align-items:center;gap:8px;
  padding:5px 4px;border-bottom:1px solid #F3F5F8;font-size:12.5px;cursor:pointer}
.rank .row:last-child{border-bottom:0}
.rank .row:hover{background:#FBFCFE}
.rank .no{color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rank .nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.rank .nm b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .bar{height:4px;border-radius:2px;background:#EDF1F7;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--blue)}
.rank .vl{text-align:right;font-variant-numeric:tabular-nums}
.rank .sh{text-align:right;color:var(--muted)}
.rank .st{text-align:right}
/* 标签 */
.tagx{display:inline-block;padding:0 6px;height:17px;line-height:16px;border-radius:3px;font-size:11px;white-space:nowrap}
.tagx.hi{background:#FDECEC;color:#C0392B;border:1px solid #F8C9C6}
.tagx.mid{background:#FFF7E6;color:#B76E00;border:1px solid #FFE0A3}
.tagx.low{background:#EEF4FF;color:#1D4ED8;border:1px solid #C9DBFF}
.tagx.ok{background:#EAF7EE;color:#1F8A4C;border:1px solid #C6E9D2}
.tagx.gray{background:#F3F5F9;color:#6B7280;border:1px solid #E1E5EC}
/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:#F7F9FC;color:#374151;font-weight:600;text-align:left;padding:9px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
.tbl td{padding:9px 10px;border-bottom:1px solid #F3F5F8;color:#333}
.tbl tbody tr:hover{background:#FBFCFE}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .op a{color:var(--blue);cursor:pointer;margin-right:10px}
.tbl .op a.mute{color:var(--muted)}
.wrapx{max-height:300px;overflow-y:auto}
.wrapx::-webkit-scrollbar{width:8px}
.wrapx::-webkit-scrollbar-thumb{background:#D6DCE8;border-radius:4px}
  text-overflow:ellipsis;white-space:nowrap}
.heat .nmcell:hover{color:var(--blue);text-decoration:underline}
/* 预警卡 */
.alist{display:flex;flex-direction:column;gap:8px;max-height:288px;overflow-y:auto}
.alist::-webkit-scrollbar{width:8px}
.alist::-webkit-scrollbar-thumb{background:#D6DCE8;border-radius:4px}
.aitem{border:1px solid #EEF1F5;border-left:3px solid var(--warn);border-radius:4px;padding:8px 10px;background:#fff;cursor:pointer}
.aitem.hi{border-left-color:var(--bad);background:#FFFBFB}
.aitem .t1{display:flex;align-items:center;gap:8px;font-size:12.5px}
.aitem .t1 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aitem .t1 .sp{flex:1}
.aitem .t2{font-size:11.5px;color:var(--muted);margin-top:4px}
.aitem .t2 em{font-style:normal;color:var(--bad);font-weight:600}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:80;display:flex;align-items:center;justify-content:center}
.dlg{width:520px;background:#fff;border-radius:6px;box-shadow:0 18px 48px rgba(0,0,0,.28);display:flex;flex-direction:column;max-height:88vh}
.dlg.wide{width:760px}
.dlg h4{margin:0;padding:14px 18px 10px;font-size:14px;border-bottom:1px solid #EEF1F5;position:relative}
.dlg h4 .x{position:absolute;right:14px;top:11px;color:#9AA6B8;cursor:pointer}
.dlg .bd{padding:14px 18px;overflow-y:auto}
.dlg .ft{display:flex;justify-content:flex-end;gap:10px;padding:10px 18px 14px;border-top:1px solid #EEF1F5}
.dlg .f{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dlg .f label{flex:0 0 118px;text-align:right;font-size:12.5px;color:#374151}
.dlg .f input{flex:1;height:30px;border:1px solid #DCE3E1;border-radius:4px;padding:0 9px;font-size:12.5px}
.dlg .tip{font-size:11.5px;color:var(--muted);line-height:1.8;background:#F7FAFF;border:1px solid #E3EDFF;
  border-radius:4px;padding:9px 11px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;font-size:12.5px;color:#4B5563}
.pager button{min-width:28px;height:28px;border:1px solid #E5E7EB;background:#fff;border-radius:3px;
  font-size:12.5px;color:#374151;cursor:pointer}
.pager button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pager button:disabled{color:#C7CDD8;cursor:not-allowed}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(12px);background:rgba(31,41,55,.94);
  color:#fff;font-size:12.5px;padding:9px 16px;border-radius:4px;opacity:0;transition:.22s;pointer-events:none;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="nav">
  <div style="display:flex;align-items:center;gap:8px"><span class="yh">YH</span><span class="nm">MIIA-AI</span></div>
  <span style="font-size:12px;color:#9FB4D4;margin-left:6px">平台运维中心</span>
  <span class="sp"></span>
  <div class="org"><b>南昌影禾医脉智能科技有限公司</b>影像质控中心</div>
  <div class="win"><span>—</span><span>▢</span><span>✕</span></div>
</header>

<div class="wrap">

  <div class="hd">
    <div>
      <h1>平台接诊量监测与增量预警</h1>
    </div>
    <div class="acts">
      <button class="btn" id="btnRule">⚙ 预警规则</button>
      <button class="btn pri" id="btnExport">↑ 导出</button>
    </div>
  </div>

  <div class="fbar">
    <div class="fi"><span>机构</span>
      <div class="sselect" id="sWrap">
        <input id="fInst" placeholder="全部机构（可搜索）" autocomplete="off">
        <span class="caret">▾</span>
        <div class="sdrop hidden" id="sDrop">
          <input class="sq" id="sQ" placeholder="输入机构名称搜索">
          <div class="slist" id="sList"></div>
        </div>
      </div>
    </div>
    <div class="fi"><span>时间</span>
      <div class="seg" id="fRange">
        <button data-v="7">近 7 天</button>
        <button data-v="30" class="on">近 30 天</button>
        <button data-v="60">近 60 天</button>
      </div>
      <input type="date" id="fFrom"><span style="color:#9AA6A3">至</span><input type="date" id="fTo">
    </div>
    <div class="fi"><span>AI工具（算法）</span><select id="fAlgo"><option value="">全部算法</option></select></div>
    <span class="sp"></span>
    <button class="btn pri" id="btnQuery">查询</button>
    <button class="btn" id="btnReset">重置</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">

    <section class="card c12">
      <div class="ch">
        <h3>每日平台接收影像数量<span style="font-weight:400;color:var(--muted);font-size:11.5px">（按例 study）</span></h3>
        <span class="sp"></span>
        <div class="legend" id="lgDaily"></div>
      </div>
      <div class="chart" id="chDaily"></div>
    </section>

    <section class="card c6">
      <div class="ch"><h3>机构接收量排行</h3><em id="rankSub"></em><span class="sp"></span>
        <button class="btn sm" id="btnAllInst">全部机构 ›</button>
      </div>
      <div class="rank" id="rankInst"></div>
    </section>

    <section class="card c6">
      <div class="ch"><h3>各算法计算量</h3><em id="algoSub"></em><span class="sp"></span></div>
      <div class="wrapx" style="max-height:330px"><table class="tbl" id="tblAlgo"></table></div>
    </section>

  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================================
   1. 数据：约 200 家接入机构 × 60 天
   ============================================================================ */
var CITIES = ['北京','上海','广州','深圳','成都','杭州','南京','武汉','西安','重庆','天津','苏州','郑州','长沙',
'沈阳','青岛','宁波','昆明','合肥','福州','济南','大连','无锡','厦门','哈尔滨','长春','南昌','贵阳','南宁','太原',
'石家庄','兰州','乌鲁木齐','呼和浩特','银川','西宁','海口','拉萨','唐山','洛阳','徐州','常州','南通','温州','绍兴',
'嘉兴','金华','台州','泉州','漳州','烟台','潍坊','淄博','临沂','济宁','泰安','保定','邯郸','秦皇岛','包头','鞍山',
'吉林','大庆','芜湖','蚌埠','安庆','九江','赣州','上饶','宜昌','襄阳','荆州','株洲','湘潭','衡阳','岳阳','常德',
'绵阳','德阳','宜宾','泸州','遵义','曲靖','桂林','柳州','三亚','湛江','汕头','珠海','佛山','东莞','中山','惠州',
'江门','肇庆','茂名','莆田','龙岩','三明','南平','宁德','湖州','衢州','丽水','舟山','盐城','扬州','镇江','泰州',
'宿迁','淮安','连云港','沧州','廊坊','邢台','衡水','临汾','运城','长治','大同','阳泉','晋城','延安','宝鸡','咸阳',
'渭南','榆林','汉中','天水','酒泉','张掖','武威','固原','石嘴山','克拉玛依','喀什','伊宁','库尔勒','日喀则','林芝',
'曲靖','玉溪','保山','昭通','丽江','普洱','临沧','文山','红河','大理','德宏','怒江','迪庆'];
var TYPES = ['市第一人民医院','市中心医院','大学附属医院','市中医医院','区人民医院','县人民医院',
             '医学影像诊断中心','人民医院','第二人民医院','妇幼保健院'];
var ALGOS = ['肺结节','骨折','肺炎','骨密度','钙化积分','结直肠'];
var ALGO_W = [0.30, 0.22, 0.18, 0.13, 0.10, 0.07];
var ALGO_COLOR = ['#2F6BFF','#00A398','#FA8C16','#7C6CF0','#E5484D','#12B5CB'];

/* 突增注入：mult 为当日相对基线的放大倍数（1+mult 即环比倍数） */
var SPIKES = [
  { date:'2026-10-18', inst:null, mult:0.62 },   // 平台级：1.62×
  { date:'2026-10-26', inst:null, mult:0.92 },   // 平台级：1.92×
  { date:'2026-11-01', inst:null, mult:1.30 },   // 平台级：2.30×
  { date:'2026-10-30', inst:2,    mult:2.30 },   // 机构级：3.3×
  { date:'2026-10-22', inst:4,    mult:2.10 }    // 机构级：3.1×
];

function pad(n){ return String(n).padStart(2,'0'); }
function rnd(i){ var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
function fmtYmd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function fmtMd(d){ return pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function num(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function sum(a){ return a.reduce(function(x,y){ return x + y; }, 0); }
function avg(a){ return a.length ? sum(a) / a.length : 0; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* 生成 200 家机构：权重按幂律分布 */
function buildInsts(){
  var out = [], N = 200;
  var raw = [], total = 0;
  for (var i = 0; i < N; i++) { var w = 1 / Math.pow(i + 1, 1.16); raw.push(w); total += w; }
  var TOP = ['四川大学华西医院','郑州大学第一附属医院','北京协和医院','复旦大学附属中山医院',
             '中山大学附属第一医院','浙江大学医学院附属第二医院','华中科技大学同济医学院附属协和医院',
             '空军军医大学西京医院'];
  for (var k = 0; k < N; k++) {
    var city = CITIES[k % CITIES.length];
    var type = TYPES[Math.floor(k / CITIES.length) % TYPES.length];
    out.push({
      id: 'I' + k, idx: k,
      name: (k < TOP.length) ? TOP[k] : (city + type),
      w: raw[k] / total,
      tier: k < 8 ? 'head' : k < 50 ? 'mid' : 'tail'
    });
  }
  return out;
}
CITIES = CITIES.filter(function (v, i){ return CITIES.indexOf(v) === i; });
var INSTS = buildInsts();
var INST_BY_ID = {}; INSTS.forEach(function (x){ INST_BY_ID[x.id] = x; });

function buildDays(){
  var out = [], i = 0;
  var d = new Date(2026, 8, 5), end = new Date(2026, 10, 3);
  var PLAT = 820;                              // 平台日均（例）
  while (d <= end) {
    var dow = d.getDay(), wk = (dow === 0 || dow === 6) ? 0.76 : 1;
    var base = PLAT * wk * (1 + 0.06 * (rnd(i) - 0.5));
    var vals = {}, tot = 0;
    INSTS.forEach(function (I) {
      var v = base * I.w * (0.82 + 0.36 * rnd(i * 13 + I.idx));
      v = Math.round(v);
      if (I.tier === 'tail' && rnd(i * 5 + I.idx) < 0.12) v = 0;   // 小机构偶发空窗
      vals[I.id] = v; tot += v;
    });
    out.push({ date: fmtYmd(d), label: fmtMd(d), total: tot, vals: vals });
    d.setDate(d.getDate() + 1); i++;
  }
  return out;
}
var DAYS = buildDays();

/* 注入突增（在基础数据之上按倍数放大，保证触发预警） */
(function applySpikes(){
  SPIKES.forEach(function (s) {
    var day = DAYS.filter(function (d){ return d.date === s.date; })[0];
    if (!day) return;
    if (s.inst === null) {
      INSTS.forEach(function (I){
        day.vals[I.id] = Math.round((day.vals[I.id] || 0) * (1 + s.mult));
      });
    } else {
      var I = INSTS[s.inst];
      day.vals[I.id] = Math.round((day.vals[I.id] || 0) * (1 + s.mult));
    }
    day.total = INSTS.reduce(function (t, I){ return t + (day.vals[I.id] || 0); }, 0);
  });
})();

/* ============================================================================
   2. 状态
   ============================================================================ */
var S = {
  inst: '', range: 30, from: '', to: '', algo: '',
  rule: { k: 1.5, min: 50, minBase: 15 },
  kind: '', level: '',
  alPage: 1, alSize: 8
};

function curDays(){
  var ds = DAYS;
  if (S.from && S.to) ds = ds.filter(function (d){ return d.date >= S.from && d.date <= S.to; });
  else ds = ds.slice(Math.max(0, ds.length - S.range));
  return ds;
}
function valOf(d, id){ return id ? (d.vals[id] || 0) : d.total; }
function instName(id){ return INST_BY_ID[id] ? INST_BY_ID[id].name : ''; }

/* ============================================================================
   3. 图表
   ============================================================================ */
function el(tag, a){
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in a) e.setAttribute(k, a[k]);
  return e;
}
function niceMax(v){
  if (v <= 5) return Math.max(1, Math.ceil(v));
  var p = Math.pow(10, String(Math.ceil(v)).length - 1);
  var steps = [1,1.2,1.5,2,2.5,3,4,5,6,8,10];
  for (var i = 0; i < steps.length; i++) if (steps[i] * p >= v) return steps[i] * p;
  return 10 * p;
}

function drawLine(host, cfg){
  host.innerHTML = '';
  var W = 1000, H = cfg.h || 260, L = 46, R = 14, T = 12, B = 30;
  var labels = cfg.labels, series = cfg.series, maxV = 0;
  series.forEach(function (s){ s.data.forEach(function (v){ if (v > maxV) maxV = v; }); });
  if (cfg.threshold) maxV = Math.max(maxV, cfg.threshold.value * 1.1);
  if (cfg.bands) cfg.bands.forEach(function (b){ b.data.forEach(function (v){ if (v > maxV) maxV = v; }); });
  var yMax = niceMax(maxV * 1.1), iw = W - L - R, ih = H - T - B, n = labels.length;
  var X = function (i){ return L + (n === 1 ? iw / 2 : iw * i / (n - 1)); };
  var Y = function (v){ return T + ih - ih * (v / yMax); };

  var svg = el('svg', { viewBox:'0 0 ' + W + ' ' + H });
  svg.setAttribute('style', 'width:100%;height:' + H + 'px');

  for (var t = 0; t <= 4; t++) {
    var v = yMax * t / 4, yy = Y(v);
    svg.appendChild(el('line', { x1:L, y1:yy, x2:W-R, y2:yy, stroke:'#EEF1F5' }));
    var tx = el('text', { x:L-8, y:yy+4, 'text-anchor':'end', fill:'#8A94A6', 'font-size':'11' });
    tx.textContent = num(v); svg.appendChild(tx);
  }
  var yl = el('text', { x:L-8, y:T-2, 'text-anchor':'end', fill:'#8A94A6', 'font-size':'10.5' });
  yl.textContent = cfg.yUnit || '例'; svg.appendChild(yl);

  var step = Math.ceil(n / 12);
  labels.forEach(function (lb, i){
    if (i % step && i !== n - 1) return;
    var t2 = el('text', { x:X(i), y:H-10, 'text-anchor':'middle', fill:'#8A94A6', 'font-size':'11' });
    t2.textContent = lb; svg.appendChild(t2);
  });

  (cfg.bands || []).forEach(function (b){
    var d = b.data.map(function (v, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
    svg.appendChild(el('path', { d: d + ' L' + X(n-1).toFixed(1) + ' ' + (T+ih) + ' L' + X(0).toFixed(1) + ' ' + (T+ih) + ' Z',
      fill:b.color, opacity:b.opacity || .10 }));
  });

  if (cfg.threshold) {
    var ty = Y(cfg.threshold.value);
    svg.appendChild(el('line', { x1:L, y1:ty, x2:W-R, y2:ty, stroke:'#E5484D', 'stroke-width':1.4,
      'stroke-dasharray':'6 5', opacity:.85 }));
    var tt = el('text', { x:W-R-4, y:ty-6, 'text-anchor':'end', fill:'#E5484D', 'font-size':'11' });
    tt.textContent = cfg.threshold.label; svg.appendChild(tt);
  }

  series.forEach(function (s){
    var d = s.data.map(function (v, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
    svg.appendChild(el('path', { d: d, fill:'none', stroke:s.color, 'stroke-width':s.width || 2,
      'stroke-dasharray': s.dash || 'none', 'stroke-linejoin':'round' }));
    if (s.dots !== false && n <= 40) {
      s.data.forEach(function (v, i){
        var c = el('circle', { cx:X(i), cy:Y(v), r:s.dash ? 0 : 2.3, fill:'#fff', stroke:s.color, 'stroke-width':1.5 });
        c.appendChild(el('title', {})).textContent = labels[i] + '：' + num(v);
        svg.appendChild(c);
      });
    }
  });

  (cfg.marks || []).forEach(function (m){
    var cx = X(m.i), cy = Y(m.v);
    svg.appendChild(el('circle', { cx:cx, cy:cy, r:9, fill:'#E5484D', opacity:.14 }));
    var c2 = el('circle', { cx:cx, cy:cy, r:3.5, fill:'#E5484D', stroke:'#fff', 'stroke-width':1.5 });
    c2.appendChild(el('title', {})).textContent = m.tip || '';
    svg.appendChild(c2);
    var tx2 = el('text', { x:cx, y:cy-13, 'text-anchor':'middle', fill:'#C0392B', 'font-size':'10.5', 'font-weight':'600' });
    tx2.textContent = '↑突增'; svg.appendChild(tx2);
  });

  host.appendChild(svg);
}

function drawBars(host, cfg){
  host.innerHTML = '';
  var W = 1000, H = cfg.h || 250, L = 46, R = 14, T = 12, B = 40;
  var cats = cfg.cats, series = cfg.series, maxV = 0;
  series.forEach(function (s){ s.data.forEach(function (v){ if (v > maxV) maxV = v; }); });
  var yMax = niceMax(maxV * 1.1), iw = W - L - R, ih = H - T - B;
  var gw = iw / cats.length, bw = Math.min(46, gw / (series.length + 1.2));
  var Y = function (v){ return T + ih - ih * (v / yMax); };

  var svg = el('svg', { viewBox:'0 0 ' + W + ' ' + H });
  svg.setAttribute('style', 'width:100%;height:' + H + 'px');
  for (var t = 0; t <= 4; t++) {
    var v = yMax * t / 4, yy = Y(v);
    svg.appendChild(el('line', { x1:L, y1:yy, x2:W-R, y2:yy, stroke:'#EEF1F5' }));
    var tx = el('text', { x:L-8, y:yy+4, 'text-anchor':'end', fill:'#8A94A6', 'font-size':'11' });
    tx.textContent = num(v); svg.appendChild(tx);
  }
  cats.forEach(function (cat, ci){
    var gx = L + gw * ci + gw / 2;
    var totalW = bw * series.length + 3 * (series.length - 1);
    series.forEach(function (s, si){
      var v = s.data[ci] || 0, h = ih * (v / yMax);
      var bx = gx - totalW / 2 + si * (bw + 3);
      var r = el('rect', { x:bx, y:T + ih - h, width:bw, height:Math.max(1, h), rx:2, fill:s.color });
      r.appendChild(el('title', {})).textContent = cat + ' · ' + s.name + '：' + num(v);
      svg.appendChild(r);
    });
    var lb = el('text', { x:gx, y:H-22, 'text-anchor':'middle', fill:'#4B5563', 'font-size':'11' });
    lb.textContent = cat; svg.appendChild(lb);
  });
  host.appendChild(svg);
}

/* ============================================================================
   4. 计算
   ============================================================================ */
function pctile(arr, p){
  var a = arr.slice().sort(function (x, y){ return x - y; });
  if (!a.length) return 0;
  var i = (a.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (i - lo);
}

/* 平台级预警（基于全部机构合计） */
function platformAlerts(days){
  var out = [], v = days.map(function (d){ return d.total; });
  for (var i = 7; i < v.length; i++) {
    var base = avg(v.slice(i-7, i));
    var ratio = v[i] / Math.max(1, base), delta = v[i] - base;
    if (ratio >= S.rule.k && delta >= S.rule.min) {
      out.push({ kind:'平台', date:days[i].date, scope:'平台合计', id:'', cur:v[i], base:Math.round(base),
        delta:Math.round(delta), ratio:ratio, level: ratio >= 3 ? '高' : ratio >= 2 ? '中' : '低', status:'未处理' });
    }
  }
  return out;
}

/* 机构级预警：仅对日均 ≥ minBase 的机构判定，避免小机构噪声 */
function instAlerts(days){
  var out = [];
  var cands = INSTS.filter(function (I){ return I.tier !== 'tail' || I.idx < 60; });
  cands.forEach(function (I){
    if (S.inst && I.id !== S.inst) return;
    var v = days.map(function (d){ return d.vals[I.id] || 0; });
    for (var i = 7; i < v.length; i++) {
      var base = avg(v.slice(i-7, i));
      if (base < S.rule.minBase) continue;
      var ratio = v[i] / Math.max(1, base), delta = v[i] - base;
      if (ratio >= S.rule.k && delta >= Math.max(20, S.rule.min * 0.4)) {
        out.push({ kind:'机构', date:days[i].date, scope:I.name, id:I.id, cur:v[i], base:Math.round(base),
          delta:Math.round(delta), ratio:ratio, level: ratio >= 3 ? '高' : ratio >= 2 ? '中' : '低', status:'未处理' });
      }
    }
  });
  return out;
}

function allAlerts(days){
  var list = platformAlerts(days).concat(instAlerts(days));
  list.sort(function (a, b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return b.ratio - a.ratio;
  });
  return list;
}


function algoTotalsFor(days, instId){
  var base = days.reduce(function (s, d){ return s + valOf(d, instId); }, 0);
  var m = {};
  ALGOS.forEach(function (a, k){
    m[a] = (S.algo && S.algo !== a) ? 0 : Math.round(base * ALGO_W[k] * 1.06);
  });
  return m;
}

/* ============================================================================
   5. 渲染
   ============================================================================ */
function renderKpis(days, alerts){
  var vals = days.map(function (d){ return valOf(d, S.inst); });
  var total = sum(vals), avgV = total / Math.max(1, vals.length);
  var peak = vals.length ? Math.max.apply(null, vals) : 0, pi = vals.indexOf(peak);
  var prevSeg = DAYS.slice(Math.max(0, DAYS.length - S.range * 2), Math.max(0, DAYS.length - S.range));
  var prevTotal = prevSeg.reduce(function (s, d){ return s + valOf(d, S.inst); }, 0);
  var mom = prevTotal ? (total - prevTotal) / prevTotal * 100 : 0;

  var k = [
    { lb:'接收影像总量', vl:num(total), unit:'例（study）', dt:'较上期 ' + pctTag(mom) },
    { lb:'日均接收量', vl:num(avgV), unit:'例/天', dt:'区间 ' + days.length + ' 天' },
    { lb:'单日峰值', vl:num(peak), unit:'例', dt:'出现在 ' + (days[pi] ? days[pi].label : '—') }
  ];
  document.getElementById('kpis').innerHTML = k.map(function (x){
    return '<div class="kpi"><div class="lb">' + x.lb + '</div>'
      + '<div class="vl">' + x.vl + '<em>' + x.unit + '</em></div>'
      + '<div class="dt">' + x.dt + '</div></div>';
  }).join('');
}
function pctTag(v){
  if (Math.abs(v) < 0.05) return '<span class="flat">持平</span>';
  return '<span class="' + (v > 0 ? 'up' : 'down') + '">' + (v > 0 ? '↑' : '↓') + ' '
    + Math.abs(v).toFixed(1) + '%</span>';
}

function renderDaily(days, alerts){
  var vals = days.map(function (d){ return valOf(d, S.inst); });
  var ma = vals.map(function (_, i){
    return Math.round(avg(vals.slice(Math.max(0, i - 6), i + 1)));
  });
  var thr = avg(vals) * S.rule.k;
  var marks = [];
  alerts.filter(function (a){ return S.inst ? a.id === S.inst : a.kind === '平台'; }).forEach(function (a){
    var i = days.map(function (d){ return d.date; }).indexOf(a.date);
    if (i >= 0) marks.push({ i:i, v:a.cur, tip:a.date + ' 平台接收 ' + num(a.cur) + ' 例（基线 ' + num(a.base) + '）' });
  });

  drawLine(document.getElementById('chDaily'), {
    labels: days.map(function (d){ return d.label; }),
    series: [
      { name:'每日接收量', color:'#2F6BFF', data:vals, width:2.2 },
      { name:'7 日均线', color:'#8A94A6', data:ma, dash:'5 4', width:1.5 }
    ],
    threshold: { value: Math.round(thr), label:'预警阈值 ' + num(Math.round(thr)) + ' 例' },
    marks: marks, h: 250
  });
  document.getElementById('lgDaily').innerHTML =
      '<span><i style="background:#2F6BFF"></i>' + (S.inst ? esc(instName(S.inst)) : '平台每日接收量') + '</span>'
    + '<span><i class="dash g"></i>7 日均线</span>'
    + '<span><i class="dash"></i>预警阈值 ' + num(Math.round(thr)) + '</span>'
    + '<span><i style="background:#E5484D"></i>突增点</span>';
}



function instTotals(days){
  return INSTS.map(function (I){
    var v = 0;
    for (var i = 0; i < days.length; i++) v += (days[i].vals[I.id] || 0);
    return { id:I.id, name:I.name, tier:I.tier, v:v };
  }).sort(function (a, b){ return b.v - a.v; });
}

function renderRank(days){
  var rows = instTotals(days);
  var total = sum(rows.map(function (r){ return r.v; }));
  var max = rows[0] ? rows[0].v : 1;
  var top = rows.slice(0, 8);
  document.getElementById('rankSub').textContent = 'Top 8 / 共 ' + rows.length + ' 家';
  document.getElementById('rankInst').innerHTML = top.map(function (r, i){
    var pct = total ? r.v / total * 100 : 0;
    return '<div class="row" data-inst="' + r.id + '"><span class="no">' + (i + 1) + '</span>'
      + '<span class="nm"><b title="' + esc(r.name) + '">' + esc(r.name) + '</b>'
      + '<span class="bar"><i style="width:' + (r.v / max * 100).toFixed(1) + '%"></i></span></span>'
      + '<span class="vl">' + num(r.v) + '</span>'
      + '<span class="sh">' + pct.toFixed(1) + '%</span></div>';
  }).join('');
  [].forEach.call(document.querySelectorAll('#rankInst .row'), function (n){
    n.onclick = function (){ openInstDetail(n.getAttribute('data-inst')); };
  });
}

function heatColor(v, max){
  if (!v) return '#F7F9FC';
  var p = Math.min(1, v / (max || 1));
  var from = [234, 241, 255], to = [47, 107, 255];
  var c = from.map(function (f, i){ return Math.round(f + (to[i] - f) * Math.pow(p, 0.75)); });
  return 'rgb(' + c.join(',') + ')';
}
function textOn(v, max){ return (v / (max || 1)) > 0.55 ? '#fff' : '#1F2937'; }

function renderHeat(){ /* 已移除 */ }

function renderAlgo(days){
  var totals = algoTotalsFor(days, S.inst);
  var sumA = sum(ALGOS.map(function (a){ return totals[a]; }));
  document.getElementById('algoSub').textContent = (S.inst ? '本机构' : '全平台') + ' · ' + days.length + ' 天';
  var h = '<thead><tr><th>算法</th><th class="num">计算量</th><th class="num">占比</th>'
        + '<th class="num">日均</th></tr></thead><tbody>';
  ALGOS.forEach(function (a){
    if (S.algo && S.algo !== a) return;
    var v = totals[a] || 0;
    h += '<tr><td>' + esc(a) + '</td><td class="num">' + num(v) + '</td>'
      + '<td class="num">' + (sumA ? (v / sumA * 100).toFixed(1) : '0.0') + '%</td>'
      + '<td class="num">' + num(v / Math.max(1, days.length)) + '</td></tr>';
  });
  h += '</tbody>';
  document.getElementById('tblAlgo').innerHTML = h;
}



function renderAll(){
  var days = curDays();
  S.alertsCache = allAlerts(days);
  S.alPage = 1;
  renderKpis(days, S.alertsCache);
  renderDaily(days, S.alertsCache);
  renderRank(days);
  renderAlgo(days);
}

function openInstDetail(id){
  var I = INST_BY_ID[id];
  if (!I) return;
  var days = curDays();
  var v = days.map(function (d){ return d.vals[id] || 0; });
  var ma = v.map(function (_, i){ return Math.round(avg(v.slice(Math.max(0, i - 6), i + 1))); });
  var thr = avg(v) * S.rule.k;
  var tot = sum(v);
  var myAlerts = S.alertsCache.filter(function (a){ return a.id === id; });

  var m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = '<div class="dlg wide"><h4>' + esc(I.name) + '<span class="x">✕</span></h4>'
    + '<div class="bd">'
    +   '<div style="display:flex;gap:26px;font-size:12.5px;color:#4B5563;margin-bottom:10px;flex-wrap:wrap">'
    +     '<span>区间接收 <b style="color:#1F2937">' + num(tot) + '</b> 例</span>'
    +     '<span>日均 <b style="color:#1F2937">' + num(tot / Math.max(1, days.length)) + '</b> 例</span>'
    +     '<span>预警 <b style="color:#C0392B">' + myAlerts.length + '</b> 次</span>'
    +   '</div>'
    +   '<div class="legend" style="margin-bottom:4px"><span><i style="background:#2F6BFF"></i>每日接收量</span>'
    +     '<span><i class="dash g"></i>7 日均线</span><span><i class="dash"></i>自身阈值 ' + Math.round(thr) + '</span></div>'
    +   '<div class="chart" id="dlgChart"></div>'
    +   '<div style="margin-top:12px"><table class="tbl" id="dlgAlgo"></table></div>'
    + '</div>'
    + '<div class="ft"><button class="btn" data-x>关闭</button>'
    +   '<button class="btn pri" data-sel>在筛选区选中该机构</button></div></div>';
  document.body.appendChild(m);
  var close = function (){ m.remove(); };
  m.querySelector('.x').onclick = close;
  m.querySelector('[data-x]').onclick = close;
  m.addEventListener('click', function (e){ if (e.target === m) close(); });
  m.querySelector('[data-sel]').onclick = function (){
    S.inst = id;
    document.getElementById('fInst').value = I.name;
    close(); renderAll(); toast('已切换到：' + I.name);
  };

  drawLine(document.getElementById('dlgChart'), {
    labels: days.map(function (d){ return d.label; }),
    series: [
      { name:'每日接收量', color:'#2F6BFF', data:v, width:2 },
      { name:'7 日均线', color:'#8A94A6', data:ma, dash:'5 4', width:1.4 }
    ],
    threshold:{ value:Math.round(thr), label:'' }, h: 210
  });

  var totals = algoTotalsFor(days, id);
  var ssum = sum(ALGOS.map(function (a){ return totals[a]; }));
  var h = '<thead><tr><th>算法</th><th class="num">计算量</th><th class="num">占比</th><th class="num">日均</th></tr></thead><tbody>';
  ALGOS.forEach(function (a){
    if (S.algo && S.algo !== a) return;
    var x = totals[a] || 0;
    h += '<tr><td>' + esc(a) + '</td><td class="num">' + num(x) + '</td>'
      + '<td class="num">' + (ssum ? (x / ssum * 100).toFixed(1) : '0.0') + '%</td>'
      + '<td class="num">' + num(x / Math.max(1, days.length)) + '</td></tr>';
  });
  h += '</tbody>';
  document.getElementById('dlgAlgo').innerHTML = h;
}

function openAllInst(){
  var days = curDays();
  var rows = instTotals(days);
  var total = sum(rows.map(function (r){ return r.v; }));
  var m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = '<div class="dlg wide"><h4>全部接入机构（' + rows.length + ' 家）<span class="x">✕</span></h4>'
    + '<div class="bd">'
    +   '<div class="f"><label style="flex:0 0 70px">搜索</label>'
    +     '<input id="aiQ" placeholder="输入机构名称过滤" style="flex:1;height:30px;border:1px solid #DCE3E1;border-radius:4px;padding:0 9px"></div>'
    +   '<div class="wrapx" style="max-height:400px"><table class="tbl" id="aiTbl"></table></div>'
    +   '<div class="pager" id="aiPager"></div>'
    + '</div><div class="ft"><button class="btn" data-x>关闭</button></div></div>';
  document.body.appendChild(m);
  var close = function (){ m.remove(); };
  m.querySelector('.x').onclick = close;
  m.querySelector('[data-x]').onclick = close;
  m.addEventListener('click', function (e){ if (e.target === m) close(); });

  var page = 1, size = 15, q = '';
  function draw(){
    var list = rows.filter(function (r){ return !q || r.name.indexOf(q) >= 0; });
    var maxP = Math.max(1, Math.ceil(list.length / size));
    if (page > maxP) page = maxP;
    var view = list.slice((page - 1) * size, page * size);
    var h = '<thead><tr><th>#</th><th>机构名称</th><th class="num">接收量</th>'
          + '<th class="num">占比</th><th class="num">日均</th><th>操作</th></tr></thead><tbody>';
    view.forEach(function (r){
      var rank = rows.map(function (x){ return x.id; }).indexOf(r.id) + 1;
      h += '<tr><td>' + rank + '</td><td>' + esc(r.name) + '</td>'
        + '<td class="num">' + num(r.v) + '</td>'
        + '<td class="num">' + (total ? (r.v / total * 100).toFixed(2) : '0.00') + '%</td>'
        + '<td class="num">' + num(r.v / Math.max(1, days.length)) + '</td>'
        + '<td class="op"><a data-open="' + r.id + '">详情</a></td></tr>';
    });
    h += '</tbody>';
    document.getElementById('aiTbl').innerHTML = h;
    var btns = '<button data-p="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>‹</button>';
    for (var p = 1; p <= maxP; p++) {
      if (p <= 3 || p === maxP || Math.abs(p - page) <= 1)
        btns += '<button data-p="' + p + '" class="' + (p === page ? 'on' : '') + '">' + p + '</button>';
    }
    btns += '<button data-p="' + (page + 1) + '"' + (page >= maxP ? ' disabled' : '') + '>›</button>';
    document.getElementById('aiPager').innerHTML =
        '<span>共 ' + list.length + ' 家 · 第 ' + page + '/' + maxP + ' 页</span>'
      + '<span style="display:flex;gap:6px">' + btns + '</span>';
    [].forEach.call(document.querySelectorAll('#aiPager [data-p]'), function (b){
      b.onclick = function (){ page = +b.getAttribute('data-p'); draw(); };
    });
    [].forEach.call(document.querySelectorAll('#aiTbl [data-open]'), function (a){
      a.onclick = function (){ close(); openInstDetail(a.getAttribute('data-open')); };
    });
  }
  document.getElementById('aiQ').onkeydown = function (e){
    if (e.key !== 'Enter') return;
    q = this.value.trim(); page = 1; draw();
  };
  draw();
}

function openRule(){
  var m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = '<div class="dlg"><h4>预警规则设置<span class="x">✕</span></h4>'
    + '<div class="bd">'
    + '<div class="f"><label>突增倍数阈值</label><input type="number" id="rk" step="0.1" min="1.1" value="' + S.rule.k + '"></div>'
    + '<div class="f"><label>最小增量（例）</label><input type="number" id="rmin" step="10" min="1" value="' + S.rule.min + '"></div>'
    + '<div class="f"><label>机构级最小基线</label><input type="number" id="rbase" step="5" min="1" value="' + S.rule.minBase + '"></div>'
    + '<div class="tip">判定逻辑：当日接收量 ≥ 前 7 日均值 × 倍数阈值，且增量 ≥ 最小增量 → 触发突增。<br>'
    + '平台级按平台合计判定；机构级按单家机构判定，且仅对「7 日均值 ≥ 机构级最小基线」的机构生效，'
    + '避免日均只有几例的机构从 2 例涨到 6 例就报警。等级：≥3× 高、≥2× 中、其余低。</div>'
    + '</div><div class="ft"><button class="btn" data-x>取消</button>'
    + '<button class="btn pri" data-ok>保存并重算</button></div></div>';
  document.body.appendChild(m);
  var close = function (){ m.remove(); };
  m.querySelector('.x').onclick = close;
  m.querySelector('[data-x]').onclick = close;
  m.addEventListener('click', function (e){ if (e.target === m) close(); });
  m.querySelector('[data-ok]').onclick = function (){
    var k = parseFloat(document.getElementById('rk').value);
    var mn = parseInt(document.getElementById('rmin').value, 10);
    var bs = parseInt(document.getElementById('rbase').value, 10);
    if (!(k > 1)) { toast('倍数阈值需大于 1'); return; }
    if (!(mn > 0)) { toast('最小增量需大于 0'); return; }
    if (!(bs > 0)) { toast('机构级最小基线需大于 0'); return; }
    S.rule.k = k; S.rule.min = mn; S.rule.minBase = bs;
    close(); renderAll(); toast('规则已更新，已按新规则重算');
  };
}

/* ============================================================================
   7. 交互
   ============================================================================ */
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(function (){ t.classList.remove('on'); }, 1800);
}

function fillInstList(kw){
  var list = INSTS.filter(function (I){ return !kw || I.name.indexOf(kw) >= 0 || I.id.toLowerCase().indexOf(kw.toLowerCase()) >= 0; });
  var h = '<div class="it" data-id="">全部机构（' + INSTS.length + ' 家）<em>聚合</em></div>';
  h += list.slice(0, 60).map(function (I){
    var v = (DAYS[DAYS.length - 1].vals[I.id] || 0);
    return '<div class="it' + (S.inst === I.id ? ' on' : '') + '" data-id="' + I.id + '">'
      + esc(I.name) + '<em>' + num(v) + '</em></div>';
  }).join('');
  if (list.length > 60) h += '<div class="none">还有 ' + (list.length - 60) + ' 家，请继续输入关键字</div>';
  if (!list.length && kw) h = '<div class="none">未找到匹配机构</div>';
  document.getElementById('sList').innerHTML = h;
  [].forEach.call(document.querySelectorAll('#sList .it'), function (it){
    it.onclick = function (){
      var id = it.getAttribute('data-id');
      S.inst = id;
      document.getElementById('fInst').value = id ? instName(id) : '';
      closeDrop(); renderAll(); toast(id ? '已选中：' + instName(id) : '已切回全部机构');
    };
  });
}
function openDrop(){
  document.getElementById('sDrop').classList.remove('hidden');
  fillInstList(document.getElementById('sQ').value.trim());
}
function closeDrop(){
  document.getElementById('sDrop').classList.add('hidden');
  document.getElementById('sQ').value = '';
}

function initFilters(){
  ALGOS.forEach(function (a){
    document.getElementById('fAlgo').insertAdjacentHTML('beforeend', '<option value="' + a + '">' + a + '</option>');
  });
  var ds = curDays();
  document.getElementById('fFrom').value = ds[0].date;
  document.getElementById('fTo').value = ds[ds.length - 1].date;

  var si = document.getElementById('fInst');
  si.onfocus = openDrop;
  si.onclick = openDrop;
  si.oninput = function (){ openDrop(); fillInstList(si.value.trim()); };
  document.getElementById('sQ').oninput = function (){ fillInstList(this.value.trim()); };
  document.addEventListener('click', function (e){
    var w = document.getElementById('sWrap');
    if (!w.contains(e.target)) closeDrop();
  });

  [].forEach.call(document.querySelectorAll('#fRange button'), function (b){
    b.onclick = function (){
      [].forEach.call(document.querySelectorAll('#fRange button'), function (x){ x.classList.remove('on'); });
      b.classList.add('on');
      S.range = +b.getAttribute('data-v'); S.from = ''; S.to = '';
      var d = curDays();
      document.getElementById('fFrom').value = d[0].date;
      document.getElementById('fTo').value = d[d.length - 1].date;
      renderAll();
    };
  });
  document.getElementById('fAlgo').onchange = function (){ S.algo = this.value; renderAll(); };

  document.getElementById('btnQuery').onclick = function (){
    var f = document.getElementById('fFrom').value, t = document.getElementById('fTo').value;
    if (f && t && f > t) { toast('开始日期不能晚于结束日期'); return; }
    S.from = f; S.to = t;
    renderAll(); toast('已按条件查询');
  };
  document.getElementById('btnReset').onclick = function (){
    S.inst = ''; S.algo = ''; S.range = 30; S.from = ''; S.to = ''; S.kind = ''; S.level = '';
    document.getElementById('fInst').value = '';
    document.getElementById('fAlgo').value = '';
    [].forEach.call(document.querySelectorAll('#fRange button'), function (x){
      x.classList.toggle('on', x.getAttribute('data-v') === '30');
    });
    var d = curDays();
    document.getElementById('fFrom').value = d[0].date;
    document.getElementById('fTo').value = d[d.length - 1].date;
    renderAll(); toast('已重置筛选条件');
  };

  document.getElementById('btnAllInst').onclick = openAllInst;
  document.getElementById('btnRule').onclick = openRule;
  document.getElementById('btnExport').onclick = function (){ toast('已导出当前区间的监测数据（示意）'); };
}

initFilters();
renderAll();
</script>
</body>
</html>
